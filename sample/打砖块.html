<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>魔幻纪元 · 巫师打砖块 | 街机智力游戏</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(ellipse at 30% 40%, #1a0c2e, #0a0512);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Cinema', 'Courier New', 'Segoe UI', '华文楷书', monospace;
            padding: 20px;
            margin: 0;
        }

        .game-container {
            background: rgba(25, 12, 45, 0.65);
            backdrop-filter: blur(4px);
            border-radius: 64px;
            padding: 20px 25px 25px 25px;
            box-shadow: 0 0 0 2px #d9a7ff66, 0 20px 35px rgba(0,0,0,0.8), inset 0 0 30px rgba(200, 130, 255, 0.3);
            border: 1px solid #cf9eff;
        }

        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 20px;
            box-shadow: 0 0 0 3px #6b3f8f, 0 0 0 6px #1e0f2a;
            cursor: none;
        }

        .info-panel {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            background: #140b22cc;
            padding: 10px 28px;
            border-radius: 60px;
            border-left: 3px solid #daaaff;
            border-right: 3px solid #daaaff;
        }

        .score-board {
            background: #2a1a3a;
            padding: 5px 22px;
            border-radius: 48px;
            font-weight: bold;
            font-size: 1.3rem;
            letter-spacing: 2px;
            box-shadow: inset 0 0 6px #e2b0ff, 0 0 12px #b77eff;
            color: #f3e6ff;
            font-family: monospace;
        }

        .lives {
            color: #f0dbff;
            font-family: monospace;
            background: #2a1a3a;
            padding: 5px 18px;
            border-radius: 48px;
            font-size: 1rem;
            box-shadow: inset 0 0 4px #c18eff;
        }

        button {
            background: #3a2552;
            border: none;
            color: #f3e6ff;
            font-family: monospace;
            font-weight: bold;
            padding: 5px 22px;
            border-radius: 48px;
            cursor: pointer;
            font-size: 0.9rem;
            border: 1px solid #c48eff;
            transition: 0.1s linear;
            box-shadow: 0 0 6px #bc7aff;
        }

        button:hover {
            background: #5f3a86;
            transform: scale(0.96);
            box-shadow: 0 0 16px #daaaff;
        }

        .controls-hint {
            margin-top: 14px;
            text-align: center;
            color: #cfb5ff;
            font-size: 12px;
            font-family: monospace;
            background: #1a0c28b3;
            padding: 6px 16px;
            border-radius: 48px;
            display: inline-block;
            width: auto;
            backdrop-filter: blur(2px);
        }
    </style>
</head>
<body>
<div>
    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="550"></canvas>
        <div class="info-panel">
            <div class="score-board">✨ 魔力: <span id="scoreValue">0</span></div>
            <div class="lives">🧙 生命符文: <span id="livesValue">3</span></div>
            <button id="resetBtn">🌀 吟唱重启</button>
        </div>
        <div class="controls-hint">
            🧝 ← → 移动魔法杖 | 击碎魔晶砖块 · 暗黑魔幻纪元
        </div>
    </div>
</div>

<script>
    (function(){
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const WIDTH = 800;
        const HEIGHT = 550;

        // ----- 魔幻风格挡板（巫师法杖祭坛）-----
        const PADDLE_WIDTH = 110;
        const PADDLE_HEIGHT = 18;
        let paddleX = (WIDTH - PADDLE_WIDTH) / 2;
        const paddleY = HEIGHT - PADDLE_HEIGHT - 12;

        // ----- 魔法球（奥术能量球）-----
        let ball = {
            x: WIDTH/2,
            y: HEIGHT - 70,
            radius: 8,
            vx: 2.9,
            vy: -3.3
        };

        // ----- 砖块系统（水晶魔晶）-----
        const BRICK_ROWS = 6;
        const BRICK_COLS = 10;
        let bricks = [];
        let score = 0;
        let lives = 3;
        let gameRunning = true;
        let animationId = null;

        // 魔幻粒子 (魔法尘埃)
        let particles = [];

        // 键盘
        const keys = { ArrowLeft: false, ArrowRight: false };

        // ---------- 初始化魔晶砖块 (神秘纹路) ----------
        function initBricks() {
            bricks = [];
            const brickWidth = (WIDTH - 30) / BRICK_COLS;
            const brickHeight = 20;
            const startX = 15;
            const startY = 68;

            // 魔幻色彩: 暗紫, 深蓝, 暗红, 紫罗兰, 秘银
            const colorTheme = [
                { main: '#6f4f8f', light: '#b77eff', rune: '#e7c4ff' },  // 紫晶
                { main: '#4f3f7f', light: '#9d6eff', rune: '#d9b0ff' },
                { main: '#3f2a6f', light: '#8a5ddf', rune: '#c99eff' },
                { main: '#2f1f5a', light: '#7749cc', rune: '#b88aff' },
                { main: '#5f3a6a', light: '#aa77dd', rune: '#e2b6ff' },
                { main: '#472f62', light: '#9966dd', rune: '#d6a8ff' }
            ];

            for(let row = 0; row < BRICK_ROWS; row++) {
                bricks[row] = [];
                for(let col = 0; col < BRICK_COLS; col++) {
                    let hp = 1;
                    // 精英魔晶: 第2,4行部分带有护盾
                    if((row === 2 || row === 4) && (col % 3 === 0 || col % 5 === 2)) hp = 2;
                    if(row === 5 && col % 4 === 1) hp = 2; // 诅咒晶石
                    bricks[row][col] = {
                        x: startX + col * brickWidth,
                        y: startY + row * brickHeight,
                        w: brickWidth - 2,
                        h: brickHeight - 2,
                        hp: hp,
                        initHp: hp,
                        style: colorTheme[row % colorTheme.length],
                        glow: Math.random() * 0.5
                    };
                }
            }
        }

        function resetGame() {
            gameRunning = true;
            score = 0;
            lives = 3;
            paddleX = (WIDTH - PADDLE_WIDTH) / 2;
            ball = {
                x: WIDTH/2,
                y: HEIGHT - 70,
                radius: 8,
                vx: 2.9 * (Math.random() > 0.5 ? 1 : -1),
                vy: -3.3
            };
            initBricks();
            particles = [];
            updateUI();
            if(animationId) cancelAnimationFrame(animationId);
            animationId = requestAnimationFrame(gameLoop);
        }

        function updateUI() {
            document.getElementById('scoreValue').innerText = score;
            document.getElementById('livesValue').innerText = lives;
        }

        // 碰撞矩形
        function collisionRect(r1, r2) {
            return !(r2.x > r1.x + r1.w ||
                r2.x + r2.w < r1.x ||
                r2.y > r1.y + r1.h ||
                r2.y + r2.h < r1.y);
        }

        // 魔幻粒子特效
        function addMagicParticles(x, y, color, isElite = false) {
            let count = isElite ? 14 : 8;
            for(let i=0; i<count; i++) {
                particles.push({
                    x: x + (Math.random() - 0.5) * 14,
                    y: y + (Math.random() - 0.5) * 14,
                    vx: (Math.random() - 0.5) * 2.8,
                    vy: (Math.random() - 0.5) * 2.5 - 1,
                    life: 0.85,
                    size: 3 + Math.random() * 5,
                    char: ['✨','🜁','🜂','🜃','🜄','⭐','✧'][Math.floor(Math.random()*7)],
                    color: color || '#e3b2ff'
                });
            }
        }

        // 砖块碰撞 & 魔力反馈
        function handleBrickCollision() {
            for(let row = 0; row < BRICK_ROWS; row++) {
                for(let col = 0; col < BRICK_COLS; col++) {
                    const brick = bricks[row][col];
                    if(!brick || brick.hp <= 0) continue;
                    const ballRect = {x: ball.x - ball.radius, y: ball.y - ball.radius, w: ball.radius*2, h: ball.radius*2};
                    const brickRect = {x: brick.x, y: brick.y, w: brick.w, h: brick.h};

                    if(collisionRect(ballRect, brickRect)) {
                        const overlapLeft = (ballRect.x + ballRect.w) - brickRect.x;
                        const overlapRight = (brickRect.x + brickRect.w) - ballRect.x;
                        const overlapTop = (ballRect.y + ballRect.h) - brickRect.y;
                        const overlapBottom = (brickRect.y + brickRect.h) - ballRect.y;
                        const minX = Math.min(overlapLeft, overlapRight);
                        const minY = Math.min(overlapTop, overlapBottom);
                        if(minX < minY) ball.vx = -ball.vx;
                        else ball.vy = -ball.vy;

                        brick.hp--;
                        if(brick.hp <= 0) {
                            const points = (brick.initHp === 2) ? 35 : 15;
                            score += points;
                            updateUI();
                            addMagicParticles(brick.x + brick.w/2, brick.y + brick.h/2, '#f0c0ff', brick.initHp === 2);
                            bricks[row][col] = null;
                        } else {
                            addMagicParticles(brick.x + brick.w/2, brick.y + brick.h/2, '#d9aaff', false);
                        }
                        // 速度微增
                        ball.vx = Math.min(Math.max(ball.vx * 1.02, -6.2), 6.2);
                        ball.vy = Math.min(Math.max(ball.vy * 1.02, -6.2), 6.2);
                        return;
                    }
                }
            }
        }

        function updateGame() {
            if(!gameRunning) return;

            if(keys.ArrowLeft && paddleX > 0) paddleX -= 7.5;
            if(keys.ArrowRight && paddleX < WIDTH - PADDLE_WIDTH) paddleX += 7.5;

            ball.x += ball.vx;
            ball.y += ball.vy;

            // 边界魔法反弹
            if(ball.x - ball.radius <= 0) { ball.x = ball.radius; ball.vx = -ball.vx; addMagicParticles(ball.x, ball.y, '#c89aff'); }
            if(ball.x + ball.radius >= WIDTH) { ball.x = WIDTH - ball.radius; ball.vx = -ball.vx; addMagicParticles(ball.x, ball.y, '#c89aff'); }
            if(ball.y - ball.radius <= 0) { ball.y = ball.radius; ball.vy = -ball.vy; addMagicParticles(ball.x, ball.y, '#e2bbff'); }

            // 法杖挡板碰撞（奥术偏移）
            if(ball.y + ball.radius >= paddleY && ball.y - ball.radius <= paddleY + PADDLE_HEIGHT &&
               ball.x + ball.radius >= paddleX && ball.x - ball.radius <= paddleX + PADDLE_WIDTH) {
                let hitPos = (ball.x - paddleX) / PADDLE_WIDTH;
                let angle = (hitPos - 0.5) * 1.25;
                let speed = Math.hypot(ball.vx, ball.vy);
                let newVx = Math.sin(angle) * speed;
                let newVy = -Math.cos(angle) * speed;
                ball.vx = Math.min(Math.max(newVx, -5.8), 5.8);
                ball.vy = newVy;
                if(ball.vy > -1.9) ball.vy = -2.4;
                ball.y = paddleY - ball.radius;
                addMagicParticles(ball.x, ball.y, '#eac0ff', false);
            }

            // 生命损失
            if(ball.y + ball.radius >= HEIGHT) {
                lives--;
                updateUI();
                if(lives <= 0) { gameRunning = false; updateUI(); return; }
                ball.x = WIDTH/2; ball.y = HEIGHT - 70;
                ball.vx = 2.9 * (Math.random() > 0.5 ? 1 : -1);
                ball.vy = -3.2;
                paddleX = (WIDTH - PADDLE_WIDTH)/2;
                addMagicParticles(ball.x, ball.y, '#ffaaee', true);
            }

            handleBrickCollision();

            // 胜利魔法
            let allGone = true;
            for(let row=0; row<BRICK_ROWS; row++) {
                for(let col=0; col<BRICK_COLS; col++) {
                    if(bricks[row] && bricks[row][col] !== null && bricks[row][col].hp > 0) allGone = false;
                }
            }
            if(allGone) { gameRunning = false; for(let i=0;i<50;i++) addMagicParticles(WIDTH/2, HEIGHT/2, '#ffd966', true); }

            // 粒子更新
            for(let i=0;i<particles.length;i++) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy;
                p.life -= 0.025;
                p.vy += 0.08;
                if(p.life <= 0 || p.y > HEIGHT+60 || p.x < -60 || p.x > WIDTH+60) {
                    particles.splice(i,1);
                    i--;
                }
            }
        }

        // ---------- 魔幻手绘风格 ----------
        function drawBackground() {
            const grad = ctx.createLinearGradient(0, 0, WIDTH*0.8, HEIGHT);
            grad.addColorStop(0, '#0f0520');
            grad.addColorStop(0.6, '#22113a');
            grad.addColorStop(1, '#0f0622');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, WIDTH, HEIGHT);
            // 星尘魔法阵
            for(let i=0;i<100;i++) {
                if(Math.random()<0.03) {
                    ctx.fillStyle = `rgba(210, 150, 255, ${0.2+Math.sin(Date.now()*0.002+i)*0.1})`;
                    ctx.beginPath();
                    ctx.arc((i*131)%WIDTH, (Date.now()*0.3+i*55)%HEIGHT, 1.5, 0, Math.PI*2);
                    ctx.fill();
                }
            }
            // 神秘符文环
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.arc(WIDTH-70, 70, 40, 0, Math.PI*2);
            ctx.strokeStyle = '#b77eff66';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.fillStyle = '#cf9eff33';
            ctx.fillText('⚝', WIDTH-78, 82);
        }

        function drawPaddle() {
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#c795ff";
            const grad = ctx.createLinearGradient(paddleX, paddleY, paddleX+PADDLE_WIDTH, paddleY+PADDLE_HEIGHT);
            grad.addColorStop(0, '#6a3e8a');
            grad.addColorStop(1, '#361f52');
            ctx.fillStyle = grad;
            ctx.fillRect(paddleX, paddleY, PADDLE_WIDTH, PADDLE_HEIGHT);
            ctx.fillStyle = "#eac0ff";
            ctx.fillRect(paddleX+8, paddleY+4, PADDLE_WIDTH-16, 3);
            for(let i=0;i<5;i++) ctx.fillRect(paddleX+12+i*18, paddleY+9, 6, 4);
            ctx.fillStyle = "#ffecb3";
            ctx.font = "bold 14px monospace";
            ctx.fillText("✦", paddleX+PADDLE_WIDTH/2-6, paddleY+13);
            ctx.shadowBlur = 0;
        }

        function drawBall() {
            ctx.shadowBlur = 12;
            ctx.shadowColor = "#f0bcff";
            const grad = ctx.createRadialGradient(ball.x-3, ball.y-3, 2, ball.x, ball.y, ball.radius);
            grad.addColorStop(0, '#fff2cc');
            grad.addColorStop(1, '#dd99ff');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(ball.x-2, ball.y-2, 2, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        function drawBricks() {
            for(let row=0; row<BRICK_ROWS; row++) {
                for(let col=0; col<BRICK_COLS; col++) {
                    const b = bricks[row]?.[col];
                    if(!b || b.hp<=0) continue;
                    const {x, y, w, h, hp, style} = b;
                    ctx.shadowBlur = 5;
                    ctx.shadowColor = "#bf7eff";
                    ctx.fillStyle = style.main;
                    ctx.fillRect(x, y, w, h);
                    ctx.fillStyle = style.light;
                    ctx.fillRect(x+2, y+2, w-4, 4);
                    ctx.strokeStyle = style.rune;
                    ctx.lineWidth = 1.2;
                    ctx.strokeRect(x+2, y+2, w-4, h-4);
                    if(hp === 2) {
                        ctx.fillStyle = "#ffdf99";
                        ctx.fillRect(x+5, y+8, w-10, 4);
                        ctx.fillStyle = "#e7b2ff";
                        ctx.fillRect(x+5, y+8, (w-10)/2, 4);
                    }
                    ctx.font = "12px 'Segoe UI Symbol'";
                    ctx.fillStyle = "#f2e0ff";
                    ctx.fillText(['🜁','🜂','🜃','🜄','✧'][row%5], x+5, y+16);
                }
            }
            ctx.shadowBlur = 0;
        }

        function drawParticles() {
            for(let p of particles) {
                ctx.font = `${p.size}px "Segoe UI Symbol", monospace`;
                ctx.fillStyle = `rgba(230, 180, 255, ${p.life*0.9})`;
                ctx.fillText(p.char, p.x, p.y);
                ctx.fillStyle = `rgba(255, 210, 255, ${p.life*0.5})`;
                ctx.fillText(p.char, p.x-1, p.y-1);
            }
        }

        function drawGameStatus() {
            if(!gameRunning) {
                ctx.fillStyle = "rgba(15, 5, 35, 0.85)";
                ctx.fillRect(0, 0, WIDTH, HEIGHT);
                ctx.font = "bold 32px 'Cinema', monospace";
                ctx.fillStyle = "#f2d9ff";
                ctx.shadowBlur = 8;
                let allBricksExist = false;
                for(let row=0; row<BRICK_ROWS; row++) {
                    for(let col=0; col<BRICK_COLS; col++) {
                        if(bricks[row] && bricks[row][col] && bricks[row][col].hp > 0) allBricksExist = true;
                    }
                }
                let msg = (!allBricksExist && lives>0) ? "✨ 魔晶净化 · 胜利 ✨" : (lives<=0 ? "💀 咒术溃败 · 重启 💀" : "🌙 沉寂法阵");
                ctx.fillText(msg, WIDTH/2 - ctx.measureText(msg).width/2, HEIGHT/2-30);
                ctx.font = "16px monospace";
                ctx.fillStyle = "#cfb5ff";
                let sub = "点击 [吟唱重启] 继续远征";
                ctx.fillText(sub, WIDTH/2 - ctx.measureText(sub).width/2, HEIGHT/2+35);
                ctx.shadowBlur = 0;
            }
        }

        function drawHUD() {
            ctx.font = "bold 14px monospace";
            ctx.fillStyle = "#e1c2ff";
            ctx.fillText("✦ 暗月魔晶阵 ✦", 24, 44);
            ctx.fillStyle = "#c18eff";
            ctx.fillText("魔法弹道", WIDTH-110, 44);
            let remaining = 0;
            for(let row=0; row<BRICK_ROWS; row++) for(let col=0; col<BRICK_COLS; col++) if(bricks[row]?.[col]?.hp > 0) remaining++;
            ctx.fillStyle = "#dbb2ff";
            ctx.fillRect(WIDTH-150, 58, 100, 8);
            ctx.fillStyle = "#be7eff";
            ctx.fillRect(WIDTH-150, 58, 100 * (1 - remaining/(BRICK_ROWS*BRICK_COLS)), 8);
            ctx.fillStyle = "#ffe2b3";
            ctx.fillText(`🧙 魔晶余烬: ${remaining}`, WIDTH-145, 54);
        }

        function render() {
            drawBackground();
            drawBricks();
            drawPaddle();
            drawBall();
            drawParticles();
            drawHUD();
            drawGameStatus();
        }

        function gameLoop() {
            if(gameRunning) updateGame();
            render();
            animationId = requestAnimationFrame(gameLoop);
        }

        window.addEventListener('keydown', (e) => {
            if(e.key === 'ArrowLeft') { keys.ArrowLeft = true; e.preventDefault(); }
            else if(e.key === 'ArrowRight') { keys.ArrowRight = true; e.preventDefault(); }
        });
        window.addEventListener('keyup', (e) => {
            if(e.key === 'ArrowLeft') keys.ArrowLeft = false;
            if(e.key === 'ArrowRight') keys.ArrowRight = false;
        });
        document.getElementById('resetBtn').addEventListener('click', () => resetGame());

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touchX = e.touches[0].clientX - rect.left;
            const scale = WIDTH / rect.width;
            let newX = touchX * scale - PADDLE_WIDTH/2;
            newX = Math.min(Math.max(newX, 0), WIDTH - PADDLE_WIDTH);
            paddleX = newX;
        });
        canvas.addEventListener('touchstart', (e) => e.preventDefault());

        initBricks();
        resetGame();
    })();
</script>
</body>
</html>
