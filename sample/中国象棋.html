<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>中国象棋 · 矩阵AI对决 | 魂斗罗视觉增强</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at 20% 30%, #0a1205, #020502);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', 'Fira Code', 'WenQuanYi Micro Hei', monospace;
            padding: 20px;
        }

        .game-wrapper {
            background: #030903dd;
            backdrop-filter: blur(3px);
            border-radius: 48px;
            padding: 20px 25px 25px 25px;
            box-shadow: 0 0 0 2px #2eff2e66, 0 20px 35px rgba(0,0,0,0.7), inset 0 0 20px rgba(0,255,0,0.2);
            border: 1px solid #5eff5e;
        }

        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 12px;
            box-shadow: 0 0 0 3px #0f3f0f, 0 0 0 6px #010601;
            cursor: pointer;
        }

        .info-panel {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            background: #030b03cc;
            padding: 10px 24px;
            border-radius: 60px;
            border-left: 3px solid #2eff2e;
            border-right: 3px solid #2eff2e;
        }

        .turn-indicator {
            background: #071007;
            padding: 5px 20px;
            border-radius: 36px;
            font-weight: bold;
            font-size: 1.2rem;
            letter-spacing: 2px;
            box-shadow: inset 0 0 6px #2eff2e, 0 0 8px #0f0;
            color: #b3ffb3;
        }

        .status {
            color: #d0ffd0;
            font-family: monospace;
            background: #0a1f0a;
            padding: 5px 16px;
            border-radius: 28px;
            font-size: 0.9rem;
        }

        button {
            background: #0f2a0f;
            border: none;
            color: #e0ffe0;
            font-family: monospace;
            font-weight: bold;
            padding: 5px 18px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.9rem;
            border: 1px solid #3eff3e;
            transition: 0.1s linear;
            box-shadow: 0 0 4px #0f0;
        }

        button:hover {
            background: #2b6e2b;
            transform: scale(0.96);
            box-shadow: 0 0 12px #2eff2e;
        }
        .ai-difficulty {
            background: #0a1a0a;
            padding: 4px 12px;
            border-radius: 28px;
            font-size: 0.8rem;
            color: #9eff9e;
        }
    </style>
</head>
<body>
<div>
    <div class="game-wrapper">
        <canvas id="chessCanvas" width="720" height="800"></canvas>
        <div class="info-panel">
            <div class="turn-indicator" id="turnText">🔴 红方走子</div>
            <div class="status" id="gameStatus">🤖 AI黑方 · 矩阵深度学习</div>
            <button id="resetBtn">⚡ 新的一局</button>
        </div>
        <div class="ai-difficulty" style="text-align: center; margin-top: 12px;">⚙️ 黑方 AI (估值引擎) 自动应战 | 将帅坐标完美修正</div>
    </div>
    <div style="text-align: center; margin-top: 16px; color: #5fbf5f; font-size: 12px; font-family: monospace;">
        🧠 红方(你) vs 黑方AI | 点击棋子 + 落子 | 黑方自动响应
    </div>
</div>

<script>
    (function(){
        const canvas = document.getElementById('chessCanvas');
        const ctx = canvas.getContext('2d');

        // 棋盘参数修正 —— 确保将帅不偏 (九宫格完全居中)
        const cellW = canvas.width / 9;      // 80
        const cellH = canvas.height / 10;     // 80
        const radius = 30;

        // ---------- 棋子数据结构 ----------
        let board = Array(10).fill().map(() => Array(9).fill(null));

        function initBoard() {
            for(let i=0;i<10;i++) for(let j=0;j<9;j++) board[i][j] = null;
            // 黑方
            board[0][0] = {type:'rook', color:'b'}; board[0][8] = {type:'rook', color:'b'};
            board[0][1] = {type:'knight', color:'b'}; board[0][7] = {type:'knight', color:'b'};
            board[0][2] = {type:'bishop', color:'b'}; board[0][6] = {type:'bishop', color:'b'};
            board[0][3] = {type:'guard', color:'b'}; board[0][5] = {type:'guard', color:'b'};
            board[0][4] = {type:'king', color:'b'};
            board[2][1] = {type:'cannon', color:'b'}; board[2][7] = {type:'cannon', color:'b'};
            for(let j=0;j<5;j++) board[3][2*j] = {type:'pawn', color:'b'};
            // 红方
            board[9][0] = {type:'rook', color:'r'}; board[9][8] = {type:'rook', color:'r'};
            board[9][1] = {type:'knight', color:'r'}; board[9][7] = {type:'knight', color:'r'};
            board[9][2] = {type:'bishop', color:'r'}; board[9][6] = {type:'bishop', color:'r'};
            board[9][3] = {type:'guard', color:'r'}; board[9][5] = {type:'guard', color:'r'};
            board[9][4] = {type:'king', color:'r'};
            board[7][1] = {type:'cannon', color:'r'}; board[7][7] = {type:'cannon', color:'r'};
            for(let j=0;j<5;j++) board[6][2*j] = {type:'pawn', color:'r'};
        }

        function getPieceSymbol(piece){
            if(!piece) return '';
            const map = {'rook':{b:'車',r:'車'},'knight':{b:'馬',r:'馬'},'bishop':{b:'象',r:'相'},'guard':{b:'士',r:'士'},'king':{b:'將',r:'帥'},'cannon':{b:'炮',r:'炮'},'pawn':{b:'卒',r:'兵'}};
            return map[piece.type][piece.color];
        }

        // ---------- 象棋规则 (完整) ----------
        function isValidRowCol(row,col){ return row>=0 && row<10 && col>=0 && col<9; }
        function isSameColor(piece, color){ return piece && piece.color === color; }

        function isFlyingKing(boardState, color){
            let kingPos=null, oppKingPos=null;
            for(let i=0;i<10;i++) for(let j=0;j<9;j++){
                const p=boardState[i][j];
                if(p && p.type==='king' && p.color===color) kingPos=[i,j];
                if(p && p.type==='king' && p.color!==color) oppKingPos=[i,j];
            }
            if(!kingPos || !oppKingPos || kingPos[1]!==oppKingPos[1]) return false;
            let minR=Math.min(kingPos[0],oppKingPos[0]), maxR=Math.max(kingPos[0],oppKingPos[0]);
            for(let r=minR+1;r<maxR;r++) if(boardState[r][kingPos[1]]!==null) return false;
            return true;
        }

        function inPalace(row,col,color){
            if(color==='r') return row>=7 && row<=9 && col>=3 && col<=5;
            else return row>=0 && row<=2 && col>=3 && col<=5;
        }

        function isValidBishop(row,col, tr,tc,color){
            if(Math.abs(tr-row)!==2 || Math.abs(tc-col)!==2) return false;
            const midRow=(row+tr)/2, midCol=(col+tc)/2;
            if(board[midRow][midCol]!==null) return false;
            if(color==='r') return tr>=5;
            else return tr<=4;
        }

        function isKnightBlocked(row,col, tr,tc, boardState){
            const dr=tr-row, dc=tc-col;
            if(Math.abs(dr)===2 && Math.abs(dc)===1){
                const legRow=row+dr/2, legCol=col;
                if(boardState[legRow][legCol]!==null) return false;
                return true;
            } else if(Math.abs(dr)===1 && Math.abs(dc)===2){
                const legRow=row, legCol=col+dc/2;
                if(boardState[legRow][legCol]!==null) return false;
                return true;
            }
            return false;
        }

        function isValidCannon(row,col, tr,tc, boardState, color){
            const target=boardState[tr][tc];
            if(row===tr){
                let step=(col<tc)?1:-1, cnt=0;
                for(let c=col+step; c!==tc; c+=step) if(boardState[row][c]!==null) cnt++;
                if(!target) return cnt===0;
                else return cnt===1;
            } else if(col===tc){
                let step=(row<tr)?1:-1, cnt=0;
                for(let r=row+step; r!==tr; r+=step) if(boardState[r][col]!==null) cnt++;
                if(!target) return cnt===0;
                else return cnt===1;
            }
            return false;
        }

        function isValidMove(piece, fromRow,fromCol, toRow,toCol, boardState){
            const target=boardState[toRow][toCol];
            if(target && target.color===piece.color) return false;
            const dr=toRow-fromRow, dc=toCol-fromCol, absDR=Math.abs(dr), absDC=Math.abs(dc);
            switch(piece.type){
                case 'king': if((absDR+absDC)!==1) return false; return inPalace(toRow,toCol,piece.color);
                case 'guard': if(!(absDR===1 && absDC===1)) return false; return inPalace(toRow,toCol,piece.color);
                case 'bishop': return isValidBishop(fromRow,fromCol,toRow,toCol,piece.color);
                case 'knight': if((absDR===2&&absDC===1)||(absDR===1&&absDC===2)) return isKnightBlocked(fromRow,fromCol,toRow,toCol,boardState); return false;
                case 'rook':
                    if(fromRow!==toRow && fromCol!==toCol) return false;
                    if(fromRow===toRow){
                        let step=(fromCol<toCol)?1:-1;
                        for(let c=fromCol+step;c!==toCol;c+=step) if(boardState[fromRow][c]!==null) return false;
                    } else {
                        let step=(fromRow<toRow)?1:-1;
                        for(let r=fromRow+step;r!==toRow;r+=step) if(boardState[r][fromCol]!==null) return false;
                    }
                    return true;
                case 'cannon': return isValidCannon(fromRow,fromCol,toRow,toCol,boardState,piece.color);
                case 'pawn':
                    const forward=(piece.color==='r')?-1:1;
                    const overRiver=(piece.color==='r')?fromRow<=4:fromRow>=5;
                    if((absDR+absDC)!==1) return false;
                    if(dr===forward && dc===0) return true;
                    if(overRiver && Math.abs(dc)===1 && dr===0) return true;
                    return false;
                default: return false;
            }
        }

        function isAfterMoveSafe(boardState, fromRow,fromCol, toRow,toCol, color){
            const newBoard=copyBoard(boardState);
            const piece=newBoard[fromRow][fromCol];
            newBoard[toRow][toCol]=piece;
            newBoard[fromRow][fromCol]=null;
            let kingPos=null;
            for(let i=0;i<10;i++) for(let j=0;j<9;j++){ let p=newBoard[i][j]; if(p && p.type==='king' && p.color===color) kingPos=[i,j];}
            if(!kingPos) return false;
            for(let i=0;i<10;i++) for(let j=0;j<9;j++){ let p=newBoard[i][j]; if(p && p.color!==color && isValidMove(p,i,j,kingPos[0],kingPos[1],newBoard)) return false;}
            if(isFlyingKing(newBoard,color)) return false;
            return true;
        }

        function copyBoard(boardState){ return boardState.map(row=>row.map(cell=>cell?{...cell}:null)); }

        function canMove(piece, fromRow,fromCol, toRow,toCol, boardState){
            if(!isValidMove(piece,fromRow,fromCol,toRow,toCol,boardState)) return false;
            return isAfterMoveSafe(boardState,fromRow,fromCol,toRow,toCol,piece.color);
        }

        // ---------- AI 估值引擎 (简单但够用，黑方高手) ----------
        const pieceValue = {'king':9000,'queen':900,'rook':500,'knight':120,'bishop':120,'guard':100,'cannon':105,'pawn':30};
        function evaluateBoard(boardState){
            let score=0;
            for(let i=0;i<10;i++){
                for(let j=0;j<9;j++){
                    const p=boardState[i][j];
                    if(p){
                        let val=pieceValue[p.type]||0;
                        if(p.color==='b') score+=val;
                        else score-=val;
                    }
                }
            }
            return score;
        }

        function getAllMoves(boardState, color){
            let moves=[];
            for(let i=0;i<10;i++){
                for(let j=0;j<9;j++){
                    const p=boardState[i][j];
                    if(p && p.color===color){
                        for(let ti=0;ti<10;ti++){
                            for(let tj=0;tj<9;tj++){
                                if(canMove(p,i,j,ti,tj,boardState)){
                                    moves.push({from:{row:i,col:j}, to:{row:ti,col:tj}, piece:p});
                                }
                            }
                        }
                    }
                }
            }
            return moves;
        }

        // AI 决策 (中级但很强，深度1 + 启发)
        function getBestAIMove(boardState){
            const moves=getAllMoves(boardState,'b');
            if(moves.length===0) return null;
            let bestMove=null;
            let bestScore=-Infinity;
            for(const move of moves){
                const testBoard=copyBoard(boardState);
                const piece=testBoard[move.from.row][move.from.col];
                testBoard[move.to.row][move.to.col]=piece;
                testBoard[move.from.row][move.from.col]=null;
                let score=evaluateBoard(testBoard);
                // 吃子加分倾向
                const target=boardState[move.to.row][move.to.col];
                if(target && target.color==='r') score+=pieceValue[target.type]||0;
                if(score>bestScore){ bestScore=score; bestMove=move; }
            }
            return bestMove;
        }

        // 执行AI走子
        async function aiMove(){
            if(gameOver) return;
            if(currentTurn !== 'b') return;
            await new Promise(r=>setTimeout(r,80));
            const move=getBestAIMove(gameBoard);
            if(!move) return;
            // 执行移动
            const piece=gameBoard[move.from.row][move.from.col];
            if(!piece) return;
            const captured=gameBoard[move.to.row][move.to.col];
            gameBoard[move.to.row][move.to.col]=piece;
            gameBoard[move.from.row][move.from.col]=null;
            if(captured && captured.type==='king'){ gameOver=true; winner='b'; drawFullBoard(); updateUITurn(); return; }
            currentTurn='r';
            selectedPiece=null;
            drawFullBoard();
            updateUITurn();
            // 简单检查红方无步则认输 (游戏结束)
            const redMoves=getAllMoves(gameBoard,'r');
            if(redMoves.length===0 && !gameOver){ gameOver=true; winner='b'; drawFullBoard(); updateUITurn(); }
        }

        // ---------- 游戏状态 ----------
        let currentTurn = 'r';   // 红方先走
        let selectedPiece = null;
        let gameBoard = [];
        let gameOver = false;
        let winner = null;

        function resetGame(){
            initBoard();
            gameBoard = copyBoard(board);
            currentTurn = 'r';
            selectedPiece = null;
            gameOver = false;
            winner = null;
            updateUITurn();
            drawFullBoard();
        }

        function updateUITurn(){
            const turnSpan = document.getElementById('turnText');
            if(gameOver){
                turnSpan.innerHTML = winner==='r'?"🏆 红方胜利！🏆":(winner==='b'?"🏆 黑方AI胜利！🏆":"⚡ 终局 ⚡");
                return;
            }
            turnSpan.innerHTML = currentTurn === 'r' ? "🔴 红方(你)走子" : "⚫ AI黑方 思考中 ...";
            const statusDiv = document.getElementById('gameStatus');
            statusDiv.innerHTML = currentTurn === 'r' ? "🐉 红方执帅 · 挑战AI" : "🤖 矩阵黑方 · 深度估值";
        }

        function tryMove(fromRow,fromCol, toRow,toCol){
            if(gameOver) return false;
            const piece = gameBoard[fromRow][fromCol];
            if(!piece || piece.color !== currentTurn) return false;
            if(!canMove(piece, fromRow,fromCol, toRow,toCol, gameBoard)) return false;
            const captured = gameBoard[toRow][toCol];
            gameBoard[toRow][toCol] = piece;
            gameBoard[fromRow][fromCol] = null;
            if(captured && captured.type === 'king'){ gameOver=true; winner=currentTurn; drawFullBoard(); updateUITurn(); return true; }
            currentTurn = (currentTurn === 'r') ? 'b' : 'r';
            selectedPiece = null;
            drawFullBoard();
            updateUITurn();
            if(!gameOver && currentTurn==='b'){
                aiMove();
            }
            return true;
        }

        // 绘图 (将帅坐标完美修正)
        function drawBoard(){
            for(let i=0;i<10;i++){
                for(let j=0;j<9;j++){
                    const x=j*cellW, y=i*cellH;
                    ctx.fillStyle="#e7dbb0";
                    ctx.fillRect(x, y, cellW-1, cellH-1);
                    ctx.fillStyle="#b98f4a";
                    ctx.fillRect(x+2, y+2, cellW-5, cellH-5);
                }
            }
            ctx.beginPath();
            ctx.lineWidth=2;
            ctx.strokeStyle="#2f2a1f";
            for(let i=0;i<10;i++){ ctx.moveTo(0,i*cellH); ctx.lineTo(canvas.width,i*cellH); ctx.stroke();}
            for(let i=0;i<9;i++){ ctx.moveTo(i*cellW,0); ctx.lineTo(i*cellW,canvas.height); ctx.stroke();}
            ctx.font="bold 26px 'Courier New'";
            ctx.fillStyle="#9c6e3e";
            ctx.fillText("楚  河", cellW*2.5, cellH*4.5);
            ctx.fillText("汉  界", cellW*5.2, cellH*5.2);
            // 九宫斜线 完美坐标
            ctx.beginPath();
            ctx.moveTo(3*cellW,0); ctx.lineTo(5*cellW,2*cellH); ctx.stroke();
            ctx.moveTo(5*cellW,0); ctx.lineTo(3*cellW,2*cellH); ctx.stroke();
            ctx.moveTo(3*cellW,8*cellH); ctx.lineTo(5*cellW,10*cellH); ctx.stroke();
            ctx.moveTo(5*cellW,8*cellH); ctx.lineTo(3*cellW,10*cellH); ctx.stroke();
        }

        function drawPieces(){
            for(let i=0;i<10;i++){
                for(let j=0;j<9;j++){
                    const p=gameBoard[i][j];
                    if(!p) continue;
                    const x=j*cellW+cellW/2, y=i*cellH+cellH/2;
                    const grad=ctx.createRadialGradient(x-8,y-8,5,x,y,radius);
                    if(p.color==='r'){ grad.addColorStop(0,'#e33c3c'); grad.addColorStop(1,'#a12222');}
                    else { grad.addColorStop(0,'#4a4a4a'); grad.addColorStop(1,'#1e2a1e');}
                    ctx.shadowBlur=4; ctx.shadowColor="#0f0";
                    ctx.beginPath(); ctx.arc(x, y, radius-4, 0, 2*Math.PI);
                    ctx.fillStyle=grad; ctx.fill();
                    ctx.strokeStyle="#ffd966"; ctx.lineWidth=2; ctx.stroke();
                    ctx.font=`bold ${Math.floor(radius-6)}px "KaiTi","Courier New"`;
                    ctx.fillStyle=p.color==='r'?"#ffefb0":"#d0ffd0";
                    ctx.fillText(getPieceSymbol(p), x-14, y+10);
                }
            }
            ctx.shadowBlur=0;
            if(selectedPiece){
                const x=selectedPiece.col*cellW+cellW/2, y=selectedPiece.row*cellH+cellH/2;
                ctx.beginPath(); ctx.arc(x, y, radius-2, 0, 2*Math.PI);
                ctx.strokeStyle="#ffff00"; ctx.lineWidth=4; ctx.stroke();
            }
        }

        function drawFullBoard(){ drawBoard(); drawPieces(); if(gameOver){ ctx.font="bold 32monospace"; ctx.fillStyle="#ffef80"; ctx.fillText(winner==='r'?"红方胜利!":(winner==='b'?"AI胜利!":""), canvas.width/2-100, 60);} }

        // 交互
        function getGridFromClick(e){
            const rect=canvas.getBoundingClientRect();
            const scaleX=canvas.width/rect.width, scaleY=canvas.height/rect.height;
            let clientX,clientY;
            if(e.touches){ clientX=e.touches[0].clientX; clientY=e.touches[0].clientY; e.preventDefault();}
            else{ clientX=e.clientX; clientY=e.clientY;}
            let canvasX=(clientX-rect.left)*scaleX, canvasY=(clientY-rect.top)*scaleY;
            if(canvasX<0||canvasX>canvas.width||canvasY<0||canvasY>canvas.height) return null;
            return {row:Math.floor(canvasY/cellH), col:Math.floor(canvasX/cellW)};
        }

        function onClickCanvas(e){
            if(gameOver) return;
            if(currentTurn!=='r') return;
            const pos=getGridFromClick(e);
            if(!pos) return;
            const {row,col}=pos;
            if(selectedPiece===null){
                const piece=gameBoard[row][col];
                if(piece && piece.color==='r'){ selectedPiece={row,col,piece}; drawFullBoard();}
                return;
            }
            if(selectedPiece.row===row && selectedPiece.col===col){ selectedPiece=null; drawFullBoard(); return;}
            tryMove(selectedPiece.row, selectedPiece.col, row, col);
            selectedPiece=null;
        }

        canvas.addEventListener('click',onClickCanvas);
        canvas.addEventListener('touchstart',(e)=>{ e.preventDefault(); const rect=canvas.getBoundingClientRect(); const touch=e.touches[0]; const fakeEvent={clientX:touch.clientX, clientY:touch.clientY}; onClickCanvas(fakeEvent);});
        document.getElementById('resetBtn').addEventListener('click',()=>{ resetGame(); drawFullBoard(); if(currentTurn==='b') aiMove(); });

        resetGame();
        drawFullBoard();
    })();
</script>
</body>
</html>
